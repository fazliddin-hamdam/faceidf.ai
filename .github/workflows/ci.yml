name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi qdrant-client google-genai httpx python-dotenv pytest ruff

      - name: Lint
        run: ruff check .

      - name: Compile
        run: python -m compileall -q main.py process_faces.py translation_cache.py tests

      - name: Test
        run: pytest
